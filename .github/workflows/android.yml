name: Android apps
on:
  push:
    branches: [main]
    paths: ["apps/*-mobile/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.app }} APK
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [customer, support, admin]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project (keeps our lib/, pubspec and icons)
        run: |
          flutter create --org com.otpprovider --project-name ${{ matrix.app }} --platforms android .
          rm -rf test
          # flutter create only grants INTERNET to debug/profile builds; release APKs need it to reach the API.
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' "$M" || sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' "$M"
          grep -n 'permission.INTERNET' "$M"
      - name: Release signing (only when this app's upload keystore secrets are set)
        env:
          KS_B64: ${{ secrets[format('ANDROID_KEYSTORE_B64_{0}', matrix.app)] }}
          KS_PASS: ${{ secrets[format('ANDROID_KEYSTORE_PASSWORD_{0}', matrix.app)] }}
          KS_ALIAS: ${{ secrets[format('ANDROID_KEY_ALIAS_{0}', matrix.app)] }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ] || [ -z "$KS_ALIAS" ]; then echo "No upload keystore secrets for ${{ matrix.app }}: release stays debug-signed and no AAB is produced."; exit 0; fi
          echo "$KS_B64" | base64 -d > android/app/upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' "$KS_PASS" "$KS_PASS" "$KS_ALIAS" > android/key.properties
          python3 ../../scripts/patch-android-signing.py android/app
          echo "SIGNED=1" >> "$GITHUB_ENV"
      - run: flutter pub add --dev flutter_lints
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Build debug APK
        run: flutter build apk --debug --dart-define=API_BASE_URL=${{ vars.API_BASE_URL || 'https://otpprovider-launch-api.vercel.app' }}
      - name: Build release APK (debug-signed unless a real keystore is wired in; NOT for store upload)
        run: flutter build apk --release --dart-define=API_BASE_URL=${{ vars.API_BASE_URL || 'https://otpprovider-launch-api.vercel.app' }}
      - name: Build signed Play bundle (AAB)
        if: env.SIGNED == '1'
        run: flutter build appbundle --release --build-number=${{ github.run_number }} --dart-define=API_BASE_URL=${{ vars.API_BASE_URL || 'https://otpprovider-launch-api.vercel.app' }}
      - name: Upload AAB for Google Play
        if: env.SIGNED == '1'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-play-aab
          retention-days: 30
          path: apps/${{ matrix.app }}-mobile/build/app/outputs/bundle/release/app-release.aab
      - name: Upload APK (the account-wide Actions storage quota can be full; the build still counts as passed)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ${{ matrix.app }}-apk
          retention-days: 3
          path: apps/${{ matrix.app }}-mobile/build/app/outputs/flutter-apk/app-release.apk
      - name: Publish APK to the "apk-latest" GitHub Release (not limited by the Actions artifact quota)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "${{ matrix.app }}-release.apk"
          gh release view apk-latest >/dev/null 2>&1 || gh release create apk-latest --prerelease --title "Android APKs (sandbox, debug-signed)" --notes "Debug-signed builds for testing only. NOT for store upload. They call the API at the address set in the API_BASE_URL repository variable." || sleep 5
          gh release upload apk-latest "${{ matrix.app }}-release.apk" --clobber
