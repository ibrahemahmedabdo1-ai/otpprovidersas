name: Mobile CI
on:
  pull_request:
    paths:
      - "apps/customer-mobile/**"
      - "apps/support-mobile/**"
      - "apps/admin-mobile/**"
      - ".github/workflows/mobile-check.yml"
  push:
    branches: [main]
    paths:
      - "apps/customer-mobile/**"
      - "apps/support-mobile/**"
      - "apps/admin-mobile/**"
      - ".github/workflows/mobile-check.yml"
permissions:
  contents: read
jobs:
  flutter:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: customer-mobile
            project: customer
          - app: support-mobile
            project: support
          - app: admin-mobile
            project: admin
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate current Android v2 project
        run: |
          flutter create --org com.otpprovider --project-name ${{ matrix.project }} --platforms android .
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' "$M" || sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' "$M"
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
