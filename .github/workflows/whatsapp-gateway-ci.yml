name: WhatsApp Gateway CI
on:
  push:
    branches:
      - main
      - fix/whatsapp-gateway-redaction-mainline
    paths:
      - "services/whatsapp-gateway/**"
      - ".github/workflows/whatsapp-gateway-ci.yml"
  pull_request:
    paths:
      - "services/whatsapp-gateway/**"
      - ".github/workflows/whatsapp-gateway-ci.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1
      - name: Install dependencies
        working-directory: services/whatsapp-gateway
        run: bun install
      - name: Receipt event unit tests
        working-directory: services/whatsapp-gateway
        run: bun test
      - name: Build gateway
        working-directory: services/whatsapp-gateway
        run: bun run check
      - name: Build the production Docker image
        working-directory: services/whatsapp-gateway
        run: docker build --tag otp-whatsapp-gateway:ci .
