name: Housekeeping
# The Gateway owns the authenticated API tick. This workflow wakes it and verifies
# that the gateway is initialized and its most recent API tick succeeded.
on:
  workflow_dispatch:

concurrency:
  group: housekeeping
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake and verify WhatsApp Gateway and authenticated API tick
        env:
          GATEWAY_URL: https://whatsapp-linked-device-gateway-production.up.railway.app
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..10}; do
            if response="$(curl -fsS --connect-timeout 8 --max-time 15 "$GATEWAY_URL/health")" && echo "$response" | jq -e '.ok == true and .ready == true and .apiTick.status == "ok"' >/dev/null; then
              echo "Gateway ready and authenticated API tick succeeded."
              exit 0
            fi
            echo "Gateway or API tick not ready on attempt $attempt; retrying."
            sleep 5
          done
          echo "::error::Gateway readiness or authenticated API tick check failed."
          exit 1
