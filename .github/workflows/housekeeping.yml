name: Housekeeping
# Free scheduler for the serverless API and best-effort WhatsApp Gateway keepalive.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call the API tick endpoint
        id: api_tick
        continue-on-error: true
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          API_URL: ${{ vars.API_BASE_URL || 'https://otpprovider-launch-api.vercel.app' }}
        run: |
          test -n "$CRON_SECRET" || { echo "CRON_SECRET not set"; exit 1; }
          curl -fsS --max-time 60 -X POST -H "X-Cron-Secret: $CRON_SECRET" "$API_URL/v1/internal/tick"

      - name: Wake and health-check WhatsApp Gateway
        env:
          GATEWAY_URL: https://whatsapp-linked-device-gateway-production.up.railway.app
        run: |
          if [ "${{ steps.api_tick.outcome }}" != "success" ]; then
            echo "::warning::The API tick endpoint did not authenticate or respond successfully. Gateway keepalive will still run; verify GitHub CRON_SECRET matches the API production CRON_SECRET."
          fi
          for attempt in 1 2 3 4; do
            if response="$(curl -fsS --connect-timeout 10 --max-time 20 "$GATEWAY_URL/health")"; then
              echo "$response"
              echo "$response" | jq -e '.ok == true' >/dev/null
              exit 0
            fi
            echo "Gateway did not answer on attempt $attempt; retrying."
            sleep 8
          done
          echo "WhatsApp Gateway health check failed after retries."
          exit 1
