name: Android mobile PR checks

on:
  pull_request:
    paths:
      - "apps/customer-mobile/**"
      - "apps/support-mobile/**"
      - "apps/admin-mobile/**"
      - ".github/workflows/android-mobile-pr-checks.yml"

permissions:
  contents: read

jobs:
  android-debug-build:
    name: ${{ matrix.app }} Android debug build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [customer, support, admin]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: |
          flutter create --org com.otpprovider --project-name ${{ matrix.app }} --platforms android .
          rm -rf test
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' "$M" || sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' "$M"
      - name: Install dependencies
        run: |
          flutter pub add --dev flutter_lints
          flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Build debug APK
        run: flutter build apk --debug --dart-define=API_BASE_URL=https://otpprovider-launch-api.vercel.app
