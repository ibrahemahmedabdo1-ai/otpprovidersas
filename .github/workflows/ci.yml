name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-tests:
    name: Package tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Link workspace packages
        run: pnpm install --no-frozen-lockfile
      - name: security
        working-directory: packages/security
        run: node --test "src/**/*.test.ts"
      - name: permissions
        working-directory: packages/permissions
        run: node --test "src/**/*.test.ts"
      - name: routing
        working-directory: packages/routing
        run: node --test "src/**/*.test.ts"
      - name: otp-engine
        working-directory: packages/otp-engine
        run: node --test "src/**/*.test.ts"

  backend-build:
    name: Backend build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - name: Type-check, build and test API
        run: pnpm -C backend/api test

  website:
    name: Website typecheck, SEO tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - name: SEO and translation tests
        working-directory: apps/website
        run: node --test tests/seo.test.ts
      - name: Type-check
        run: pnpm -C apps/website typecheck
      - name: Build
        run: pnpm -C apps/website build
        env:
          NEXT_PUBLIC_SITE_URL: https://otpprovider.com

  customer-web:
    name: Customer web typecheck, i18n tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - name: i18n tests
        working-directory: apps/customer-web
        run: node --test tests/i18n.test.ts
      - name: Type-check
        run: pnpm -C apps/customer-web typecheck
      - name: Build
        run: pnpm -C apps/customer-web build

  admin-web:
    name: Admin web typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - name: Type-check
        run: pnpm -C apps/admin-web typecheck
      - name: Build
        run: pnpm -C apps/admin-web build

  support-web:
    name: Support web typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - name: Type-check
        run: pnpm -C apps/support-web typecheck
      - name: Build
        run: pnpm -C apps/support-web build

  database-tests:
    name: Database migration and ledger tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: otp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_DIRECT: postgresql://postgres:ci-only-password@localhost:5432/otp_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply migrations
        run: node scripts/migrate.mjs
      - name: Ledger and constraint tests
        run: psql "$DATABASE_URL_DIRECT" -v ON_ERROR_STOP=1 -f tests/billing/ledger.test.sql
      - name: WhatsApp receipt correlation SQL tests
        run: psql "$DATABASE_URL_DIRECT" -v ON_ERROR_STOP=1 -f tests/whatsapp/receipt-correlation.test.sql
      - name: WhatsApp admin test-send job SQL tests
        run: psql "$DATABASE_URL_DIRECT" -v ON_ERROR_STOP=1 -f tests/whatsapp/test-send-jobs.test.sql
      - name: Reconciliation SQL tests
        run: psql "$DATABASE_URL_DIRECT" -v ON_ERROR_STOP=1 -f tests/billing/reconciliation.test.sql
      - name: Auth SQL tests
        run: psql "$DATABASE_URL_DIRECT" -v ON_ERROR_STOP=1 -f tests/auth/auth-sql.test.sql
      - name: OTP and projects SQL tests
        run: psql "$DATABASE_URL_DIRECT" -v ON_ERROR_STOP=1 -f tests/otp/otp-sql.test.sql
      - name: Concurrent brute-force test
        run: bash tests/otp/concurrency.sh
      - name: Wallet deposit tests
        run: psql "$DATABASE_URL_DIRECT" -v ON_ERROR_STOP=1 -f tests/billing/deposits.test.sql
      - name: Coupon tests
        run: psql "$DATABASE_URL_DIRECT" -v ON_ERROR_STOP=1 -f tests/billing/coupons.test.sql
      - name: Linked deposit SQL tests
        run: psql "$DATABASE_URL_DIRECT" -v ON_ERROR_STOP=1 -f tests/support/linked-deposits.test.sql
      - name: Translation SQL tests
        run: psql "$DATABASE_URL_DIRECT" -v ON_ERROR_STOP=1 -f tests/translation/translation.test.sql
      - name: Admin approvals and MFA SQL tests
        run: psql "$DATABASE_URL_DIRECT" -v ON_ERROR_STOP=1 -f tests/admin/admin-sql.test.sql
