openapi: 3.0.3
info:
  title: OTPProvider API
  version: 1.0.0-sandbox
  description: |
    Sandbox-only. Live sending is not enabled; test keys start with otp_test_. Errors are {"error": "<code>", ...}.
    Browser clients use the httpOnly cookie otp_session (same origin). Mobile clients send header X-Client-Type: mobile and use the returned token as a Bearer token.
    Staff sessions are MFA-pending until /v1/auth/mfa/verify or /confirm succeeds; protected routes then answer 403 mfa_required.
servers:
  - url: http://localhost:3001
components:
  securitySchemes:
    sessionCookie: {type: apiKey, in: cookie, name: otp_session}
    bearerSession: {type: http, scheme: bearer, description: "Session token (mobile)"}
    apiKey: {type: http, scheme: bearer, description: "Developer API key, otp_test_..."}
  schemas:
    Error:
      type: object
      properties:
        error: {type: string}
paths:
  /health/live:
    get:
      tags: ["Health"]
      summary: "Liveness probe"
      security: []
      responses:
        "200": {description: OK}
        "429": {description: Rate limited}
  /health/ready:
    get:
      tags: ["Health"]
      summary: "Readiness probe (checks the database)"
      security: []
      responses:
        "200": {description: OK}
        "429": {description: Rate limited}
  /v1/auth/register:
    post:
      tags: ["Auth"]
      summary: "Create a customer account (always answers 202, never reveals whether the email exists)"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: {type: string, description: "string"}
                password: {type: string, description: "string, 12-128 chars"}
                name: {type: string, description: "string"}
                locale: {type: string, description: "en|ar|ru|es|de|zh"}
      responses:
        "202": {description: OK}
        "400": {description: Validation failed}
        "429": {description: Rate limited}
  /v1/auth/verify-email:
    post:
      tags: ["Auth"]
      summary: "Confirm an email with the one-time token from the email"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token: {type: string, description: "string"}
      responses:
        "200": {description: OK}
        "400": {description: Validation failed}
        "429": {description: Rate limited}
  /v1/auth/sso/start:
    post:
      tags: ["Auth"]
      summary: "Single sign-in: an authenticated session (MFA complete) gets a one-time code (30 s) to open one panel it is allowed to use."
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [target], properties: {target: {type: string, enum: [console, admin, support]}}}
      responses:
        "200": {description: "{ code }"}
        "403": {description: This role cannot open that panel}
  /v1/auth/sso/redeem:
    post:
      tags: ["Auth"]
      summary: "Exchange a single-use hand-off code for a session cookie on the calling panel's origin."
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [code], properties: {code: {type: string}}}
      responses:
        "200": {description: Signed in}
        "400": {description: Code invalid, expired or already used}
  /v1/auth/customers/{id}/password-reset:
    post:
      tags: ["Auth"]
      summary: "Admin / Super Admin only: email a customer a one-time reset link (1 hour). Not available to Support or customers."
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: OK}
        "403": {description: Not an Admin}
        "404": {description: No active customer account}
        "503": {description: Email could not be sent}
  /v1/auth/password/reset:
    post:
      tags: ["Auth"]
      summary: "Set a new password with a one-time token; ends all sessions"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token: {type: string, description: "string"}
                password: {type: string, description: "string, 12-128 chars"}
      responses:
        "200": {description: OK}
        "400": {description: Validation failed}
        "429": {description: Rate limited}
  /v1/auth/login:
    post:
      tags: ["Auth"]
      summary: "Sign in. Staff receive an MFA-pending session until /mfa/verify (or /mfa/confirm) succeeds"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: {type: string, description: "string"}
                password: {type: string, description: "string"}
      responses:
        "200": {description: OK}
        "400": {description: Validation failed}
        "429": {description: Rate limited}
  /v1/auth/logout:
    post:
      tags: ["Auth"]
      summary: "End the current session"
      security: [{sessionCookie: []}, {bearerSession: []}]
      responses:
        "204": {description: OK}
        "401": {description: Not signed in, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "429": {description: Rate limited}
  /v1/auth/me:
    get:
      tags: ["Auth"]
      summary: "Current user and MFA state"
      security: [{sessionCookie: []}, {bearerSession: []}]
      responses:
        "200": {description: OK}
        "401": {description: Not signed in, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /v1/auth/sessions:
    get:
      tags: ["Auth"]
      summary: "List own active sessions"
      security: [{sessionCookie: []}, {bearerSession: []}]
      responses:
        "200": {description: OK}
        "401": {description: Not signed in, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /v1/auth/sessions/{id}:
    delete:
      tags: ["Auth"]
      summary: "Revoke one of own sessions"
      security: [{sessionCookie: []}, {bearerSession: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: OK}
        "401": {description: Not signed in, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /v1/auth/mfa/setup:
    post:
      tags: ["MFA"]
      summary: "Start TOTP enrolment; returns the secret and otpauth URI"
      security: [{sessionCookie: []}, {bearerSession: []}]
      responses:
        "200": {description: OK}
        "401": {description: Not signed in, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "429": {description: Rate limited}
  /v1/auth/mfa/confirm:
    post:
      tags: ["MFA"]
      summary: "Confirm enrolment with a TOTP code; returns 10 single-use recovery codes once"
      security: [{sessionCookie: []}, {bearerSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code: {type: string, description: "6 digits"}
      responses:
        "200": {description: OK}
        "401": {description: Not signed in, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "400": {description: Validation failed}
        "429": {description: Rate limited}
  /v1/auth/mfa/verify:
    post:
      tags: ["MFA"]
      summary: "Complete sign-in with a TOTP code or a recovery code"
      security: [{sessionCookie: []}, {bearerSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code: {type: string, description: "6 digits (or) recoveryCode: string"}
      responses:
        "200": {description: OK}
        "401": {description: Not signed in, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "400": {description: Validation failed}
        "429": {description: Rate limited}
  /v1/otp/send:
    post:
      tags: ["OTP (developer API)"]
      summary: "Send a sandbox OTP. Test keys only; live mode returns live_mode_not_enabled"
      security: [{apiKey: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                channel: {type: string, description: "email|whatsapp"}
                to: {type: string, description: "email or E.164 number"}
      responses:
        "201": {description: OK}
        "401": {description: Not signed in, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "400": {description: Validation failed}
        "429": {description: Rate limited}
  /v1/otp/verify:
    post:
      tags: ["OTP (developer API)"]
      summary: "Verify a code"
      security: [{apiKey: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id: {type: string, description: "string"}
                code: {type: string, description: "4-8 digits"}
      responses:
        "200": {description: OK}
        "401": {description: Not signed in, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "400": {description: Validation failed}
        "429": {description: Rate limited}
  /v1/otp/resend:
    post:
      tags: ["OTP (developer API)"]
      summary: "Issue a new code for an open request"
      security: [{apiKey: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id: {type: string, description: "string"}
      responses:
        "200": {description: OK}
        "401": {description: Not signed in, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "400": {description: Validation failed}
        "429": {description: Rate limited}
  /v1/otp/cancel:
    post:
      tags: ["OTP (developer API)"]
      summary: "Cancel an open request"
      security: [{apiKey: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id: {type: string, description: "string"}
      responses:
        "200": {description: OK}
        "401": {description: Not signed in, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "400": {description: Validation failed}
        "429": {description: Rate limited}
  /v1/otp/{id}:
    get:
      tags: ["OTP (developer API)"]
      summary: "Read the status of a request"
      security: [{apiKey: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: OK}
        "401": {description: Not signed in, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /v1/balance:
    get:
      tags: ["OTP (developer API)"]
      summary: "Wallet balances for the key's organization"
      security: [{apiKey: []}]
      responses:
        "200": {description: OK}
        "401": {description: Not signed in, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /v1/usage:
    get:
      tags: ["OTP (developer API)"]
      summary: "Usage for the last 30 days"
      security: [{apiKey: []}]
      responses:
        "200": {description: OK}
        "401": {description: Not signed in, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /v1/console/projects:
    get:
      tags: ["Console"]
      summary: "List projects"
      security: [{sessionCookie: []}, {bearerSession: []}]
      responses:
        "200": {description: OK}
        "401": {description: Not signed in, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
    post:
      tags: ["Console"]
      summary: "Create a project"
      security: [{sessionCookie: []}, {bearerSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string, description: "string, 1-60 chars"}
      responses:
        "201": {description: OK}
        "401": {description: Not signed in, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "400": {description: Validation failed}
        "429": {description: Rate limited}
  /v1/console/projects/{id}/keys:
    get:
      tags: ["Console"]
      summary: "List API keys of a project (prefixes only)"
      security: [{sessionCookie: []}, {bearerSession: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: OK}
        "401": {description: Not signed in, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
    post:
      tags: ["Console"]
      summary: "Create a test API key; the full key is shown once"
      security: [{sessionCookie: []}, {bearerSession: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mode: {type: string, description: "test"}
      responses:
        "201": {description: OK}
        "401": {description: Not signed in, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "400": {description: Validation failed}
        "429": {description: Rate limited}
  /v1/console/projects/{id}/keys/{keyId}:
    delete:
      tags: ["Console"]
      summary: "Revoke an API key"
      security: [{sessionCookie: []}, {bearerSession: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: keyId, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: OK}
        "401": {description: Not signed in, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /v1/console/stats:
    get:
      tags: ["Console"]
      summary: "Dashboard statistics for the signed-in organization: 30-day sends, delivery rate per channel, spend and low-balance flag. Aggregated from live data only."
      security: [{sessionCookie: []}, {bearerSession: []}]
      responses:
        "200": {description: OK}
        "401": {description: Not signed in, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /v1/admin/stats:
    get:
      tags: ["Admin"]
      summary: "Admin dashboard statistics: customers, OTP volume, revenue and liabilities, pending deposits, provider and device health, open tickets. Admin and Super Admin only."
      security: [{sessionCookie: []}, {bearerSession: []}]
      responses:
        "200": {description: OK}
        "401": {description: Not signed in, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "403": {description: Not allowed, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /v1/support/translation:
    get:
      tags: ["Staff: support"]
      summary: "Translation availability for the signed-in agent: provider configured, system switch, agent permission and language"
      security: [{sessionCookie: []}, {bearerSession: []}]
      responses:
        "200": {description: OK}
        "401": {description: Not signed in, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "403": {description: Not allowed, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
    patch:
      tags: ["Staff: support"]
      summary: "Agent sets own translation on/off and language (blocked if an Admin disallowed it)"
      security: [{sessionCookie: []}, {bearerSession: []}]
      responses:
        "200": {description: OK}
        "401": {description: Not signed in, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "403": {description: Not allowed, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /v1/support/translation/tickets/{id}/settings:
    post:
      tags: ["Staff: support"]
      summary: "Per-conversation translation on/off and customer language override"
      security: [{sessionCookie: []}, {bearerSession: []}]
      responses:
        "200": {description: OK}
        "401": {description: Not signed in, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "403": {description: Not allowed, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /v1/support/translation/tickets/{id}/translate:
    post:
      tags: ["Staff: support"]
      summary: "Translate the customer messages of a ticket into the agent language. Idempotent; never re-translates; reports not_configured honestly"
      security: [{sessionCookie: []}, {bearerSession: []}]
      responses:
        "200": {description: OK}
        "401": {description: Not signed in, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "403": {description: Not allowed, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /v1/support/translation/tickets/{id}/reply:
    post:
      tags: ["Staff: support"]
      summary: "Send a public reply, then store its translation for the customer. The reply is saved even if translation fails"
      security: [{sessionCookie: []}, {bearerSession: []}]
      responses:
        "200": {description: OK}
        "401": {description: Not signed in, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "403": {description: Not allowed, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /v1/admin/translation:
    get:
      tags: ["Staff: admin"]
      summary: "Translation management: provider status, usage, errors, per-agent permissions (Admin)"
      security: [{sessionCookie: []}, {bearerSession: []}]
      responses:
        "200": {description: OK}
        "401": {description: Not signed in, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "403": {description: Not allowed, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
    patch:
      tags: ["Staff: admin"]
      summary: "Enable or disable translation, languages and daily character limit. Enabling needs a configured provider and data-sharing confirmation"
      security: [{sessionCookie: []}, {bearerSession: []}]
      responses:
        "200": {description: OK}
        "401": {description: Not signed in, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "403": {description: Not allowed, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /v1/admin/translation/agents/{id}:
    patch:
      tags: ["Staff: admin"]
      summary: "Allow or forbid a staff member from using translation"
      security: [{sessionCookie: []}, {bearerSession: []}]
      responses:
        "200": {description: OK}
        "401": {description: Not signed in, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "403": {description: Not allowed, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /v1/admin/translation/test:
    post:
      tags: ["Staff: admin"]
      summary: "Send a harmless test phrase to the real provider and report success or a short error code"
      security: [{sessionCookie: []}, {bearerSession: []}]
      responses:
        "200": {description: OK}
        "401": {description: Not signed in, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "403": {description: Not allowed, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /v1/support/deposits:
    get:
      tags: ["Support"]
      summary: "Open top-up requests (requested or under review) for Support"
      security: [{sessionCookie: []}, {bearerSession: []}]
      responses:
        "200": {description: OK}
        "401": {description: Not signed in, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "403": {description: Not allowed, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /v1/support/deposits/{id}/submit:
    post:
      tags: ["Support"]
      summary: "Support submits evidence notes so an administrator can review. Never credits or approves."
      security: [{sessionCookie: []}, {bearerSession: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200": {description: OK}
        "400": {description: Validation failed, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "401": {description: Not signed in, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "403": {description: Only support staff, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "409": {description: Deposit not open, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /v1/admin/whatsapp/devices:
    get:
      tags: ["Admin"]
      summary: "Linked WhatsApp devices and their state (Admin / Super Admin)"
      security: [{sessionCookie: []}, {bearerSession: []}]
      responses:
        "200": {description: OK}
        "403": {description: Not allowed, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "503": {description: Gateway unavailable or not configured, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /v1/admin/whatsapp/devices/{deviceId}/routing:
    patch:
      tags: ["Admin"]
      summary: "Super Admin only: enable or disable a connected WhatsApp device for customer routing; does not activate customer sending"
      security: [{sessionCookie: []}, {bearerSession: []}]
      parameters:
        - {name: deviceId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [enabled], properties: {enabled: {type: boolean}}}
      responses:
        "200": {description: Routing eligibility updated}
        "400": {description: Validation failed}
        "403": {description: Super Admin only}
        "404": {description: Device not found}
        "409": {description: Device must be connected before enabling routing}
  /v1/admin/whatsapp/test-send:
    post:
      tags: ["Admin"]
      summary: "Queue one test message to an allow-listed recipient and return a job id immediately. Idempotent per requestId. Accepted is not delivered."
      security: [{sessionCookie: []}, {bearerSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, deviceId, message, requestId]
              properties:
                to: {type: string}
                deviceId: {type: string, format: uuid}
                message: {type: string, maxLength: 200}
                requestId: {type: string, format: uuid, description: "Client-generated idempotency key; replays return the same job and never send twice"}
      responses:
        "202": {description: "Job queued or replayed. status is one of queued, sending, accepted, failed, unknown"}
        "400": {description: Validation failed, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "403": {description: Not allowed or recipient not allow-listed, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "429": {description: Rate limited, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "503": {description: Gateway unavailable or not configured, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /v1/admin/whatsapp/test-jobs/{jobId}:
    get:
      tags: ["Admin"]
      summary: "Status of a queued WhatsApp test send (queued, sending, accepted, failed, unknown)"
      security: [{sessionCookie: []}, {bearerSession: []}]
      parameters: [{name: jobId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200": {description: OK}
        "400": {description: Validation failed, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "403": {description: Not allowed, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "404": {description: Job not found, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /v1/admin/whatsapp/receipts/{messageId}:
    get:
      tags: ["Admin"]
      summary: "Delivery receipt events recorded by the gateway for a message"
      security: [{sessionCookie: []}, {bearerSession: []}]
      parameters: [{name: messageId, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: OK}
        "403": {description: Not allowed, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "501": {description: Gateway receipts endpoint not deployed, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "503": {description: Gateway unavailable or not configured, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /v1/preferences:
    get:
      tags: ["Console"]
      summary: "Saved interface language of the signed-in user"
      security: [{sessionCookie: []}, {bearerSession: []}]
      responses:
        "200": {description: OK}
        "401": {description: Not signed in, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "403": {description: Not allowed, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /v1/preferences/locale:
    put:
      tags: ["Console"]
      summary: "Save the signed-in user interface language (ar, en, ru, es, de, zh); persists across devices"
      security: [{sessionCookie: []}, {bearerSession: []}]
      responses:
        "200": {description: OK}
        "401": {description: Not signed in, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
